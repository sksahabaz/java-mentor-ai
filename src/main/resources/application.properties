spring.application.name=java-mentor-ai
spring.ai.google.genai.api-key=${Gemini_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

spring.datasource.url=jdbc:mysql://localhost:3306/sms_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=mysql
logging.level.org.springframework.security=INFO

jwt.secret=${JWT_SECRET}
jwt.issuer=javamentor-ai
jwt.expiry-seconds=900
jwt.refresh-expiry-seconds=604800

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback
app.cors.allowed-origins=http://localhost:5173
