spring.application.name=java-mentor-ai
spring.ai.google.genai.api-key=${Gemini_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# ---------- MySQL connection ----------
# Database "sms_db" is created automatically if it doesn't exist.
# Username/password come from environment variables (set them in Eclipse Run Configurations).
spring.datasource.url=jdbc:mysql://localhost:3306/sms_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate (students table) ----------
# update = create/alter tables from @Entity classes, never drop data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Spring AI chat memory in MySQL ----------
# always = run Spring AI's schema-mysql.sql at startup (CREATE TABLE IF NOT EXISTS SPRING_AI_CHAT_MEMORY)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=mysql
